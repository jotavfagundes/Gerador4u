[supervisord]
nodaemon=true

[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile
autorestart=true
user=root
stdout_logfile=/var/log/frankenphp_stdout.log
stderr_logfile=/var/log/frankenphp_sterr.log

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/var/log/cron_stdout.log
stderr_logfile=/var/log/cron_stdout.log

[program:mailcow-provision]
command=/bin/sh /app/bin/provision-mailcow
startsecs=0
autorestart=unexpected
stopasgroup=true
stdout_logfile=/var/log/mailcow_provision.log
redirect_stderr=true

[program:n8n-delivery]
command=/bin/sh /app/bin/deliver-n8n
startsecs=0
autorestart=unexpected
stopasgroup=true
stdout_logfile=/var/log/n8n_delivery.log
redirect_stderr=true
